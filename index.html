<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prancheta RH</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="app">


        <!-- ============================= -->
        <!-- MENU LATERAL -->
        <!-- ============================= -->

        <aside class="sidebar">

            <div class="logo">

                <div class="logo-icon">
                    PR
                </div>

                <div>

                    <h1>Prancheta RH</h1>

                    <span>
                        Recursos Humanos
                    </span>

                </div>

            </div>


            <div class="menu">


                <!-- CÁLCULOS -->

                <div class="grupo">

                    <div class="titulo-grupo">
                        CÁLCULOS
                    </div>


                    <button
                        class="menu-item ativo"
                        onclick="abrirPagina('ferias', this)"
                    >
                        <span>Férias</span>
                    </button>


                    <button
                        class="menu-item"
                        onclick="abrirPagina('consignado', this)"
                    >
                        <span>Empréstimo consignado</span>
                    </button>


                    <button
                        class="menu-item"
                        onclick="abrirPagina('folha', this)"
                    >
                        <span>Folha de pagamento</span>
                    </button>

                </div>



                <!-- MATRÍCULA -->

                <div class="grupo">

                    <div class="titulo-grupo">
                        MATRÍCULA
                    </div>


                    <button
                        class="menu-item"
                        onclick="abrirPagina('cadastrar', this)"
                    >
                        <span>Cadastrar funcionário</span>
                    </button>


                    <button
                        class="menu-item"
                        onclick="abrirPagina('funcionarios', this)"
                    >
                        <span>Funcionários</span>
                    </button>


                    <button
                        class="menu-item"
                        onclick="abrirPagina('planilhas', this)"
                    >
                        <span>Planilhas de funcionários</span>
                    </button>


                    <button
                        class="menu-item"
                        onclick="exportarFuncionarios()"
                    >
                        <span>Exportar funcionários</span>
                    </button>

                </div>

            </div>


            <div class="versao">

                Prancheta RH<br>

                <span>Versão Beta</span>

            </div>

        </aside>



        <!-- ============================= -->
        <!-- ÁREA PRINCIPAL -->
        <!-- ============================= -->

        <main class="conteudo">

            <header class="cabecalho">

                <div>

                    <h2 id="tituloPagina">
                        Cálculo de Férias
                    </h2>

                    <p id="subtituloPagina">
                        Cálculo e controle de férias
                    </p>

                </div>

            </header>


            <!-- CONTEÚDO -->

            <section
                id="areaConteudo"
                class="area-conteudo"
            >

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
