<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Beta</title>
    <link rel="stylesheet" href="style.css">

    <!-- Biblioteca para trabalhar com Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

<header>
    <h1>RH Beta</h1>
    <p>Sistema de Recursos Humanos</p>
</header>

<nav>
    <button onclick="mostrarTela('inicio')">Início</button>
    <button onclick="mostrarTela('funcionarios')">Funcionários</button>
    <button onclick="mostrarTela('ferias')">Férias</button>
    <button onclick="mostrarTela('consignado')">Consignado</button>
    <button onclick="mostrarTela('planilhas')">Planilhas</button>
</nav>

<main>

    <!-- INÍCIO -->
    <section id="inicio" class="tela ativa">

        <h2>Dashboard</h2>

        <div class="cards">

            <div class="card">
                <span>Funcionários</span>
                <strong id="totalFuncionarios">0</strong>
            </div>

            <div class="card">
                <span>Férias cadastradas</span>
                <strong id="totalFerias">0</strong>
            </div>

            <div class="card">
                <span>Empréstimos</span>
                <strong id="totalEmprestimos">0</strong>
            </div>

        </div>

    </section>


    <!-- FUNCIONÁRIOS -->
    <section id="funcionarios" class="tela">

        <h2>Funcionários</h2>

        <div class="formulario">

            <input id="nome" type="text" placeholder="Nome">

            <input id="cpf" type="text" placeholder="CPF">

            <input id="matricula" type="text" placeholder="Matrícula">

            <input id="cargo" type="text" placeholder="Cargo">

            <input id="salario" type="number" step="0.01" placeholder="Salário">

            <input id="admissao" type="date">

            <button onclick="cadastrarFuncionario()">
                Cadastrar
            </button>

        </div>

        <input
            class="pesquisa"
            id="pesquisaFuncionario"
            type="text"
            placeholder="Pesquisar funcionário..."
            oninput="listarFuncionarios()"
        >

        <div id="listaFuncionarios"></div>

    </section>


    <!-- FÉRIAS -->
    <section id="ferias" class="tela">

        <h2>Cálculo de Férias</h2>

        <div class="formulario">

            <select id="funcionarioFerias">
                <option value="">Selecione o funcionário</option>
            </select>

            <input
                id="diasFerias"
                type="number"
                value="30"
                min="1"
                max="30"
                placeholder="Dias de férias"
            >

            <select id="abono">
                <option value="nao">Sem abono</option>
                <option value="sim">Com abono de 10 dias</option>
            </select>

            <button onclick="calcularFerias()">
                Calcular
            </button>

        </div>

        <div id="resultadoFerias" class="resultado"></div>

    </section>


    <!-- CONSIGNADO -->
    <section id="consignado" class="tela">

        <h2>Empréstimo Consignado</h2>

        <div class="formulario">

            <select id="funcionarioConsignado">
                <option value="">Selecione o funcionário</option>
            </select>

            <input
                id="valorEmprestimo"
                type="number"
                step="0.01"
                placeholder="Valor do empréstimo"
            >

            <input
                id="juros"
                type="number"
                step="0.01"
                placeholder="Juros mensal (%)"
            >

            <input
                id="parcelas"
                type="number"
                min="1"
                placeholder="Número de parcelas"
            >

            <button onclick="calcularConsignado()">
                Calcular
            </button>

        </div>

        <div id="resultadoConsignado" class="resultado"></div>

    </section>


    <!-- PLANILHAS -->
    <section id="planilhas" class="tela">

        <h2>Planilhas</h2>

        <p>Importar funcionários através de uma planilha Excel.</p>

        <input
            type="file"
            id="arquivoExcel"
            accept=".xlsx,.xls"
            onchange="importarExcel(event)"
        >

        <br><br>

        <button onclick="exportarExcel()">
            Exportar funcionários para Excel
        </button>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
