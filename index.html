<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prancheta RH</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- MENU LATERAL -->
    <aside class="sidebar">

        <div class="logo">
            <strong>PRANCHETA RH</strong>
            <span>Sistema de Recursos Humanos</span>
        </div>

        <nav class="menu">

            <div class="menu-titulo">CÁLCULOS</div>

            <button class="menu-item ativo" onclick="abrirPagina('ferias', this)">
                Férias
            </button>

            <button class="menu-item" onclick="abrirPagina('consignado', this)">
                Empréstimo consignado
            </button>

            <button class="menu-item" onclick="abrirPagina('folha', this)">
                Folha de pagamento
            </button>


            <div class="menu-titulo espacamento">MATRÍCULA</div>

            <button class="menu-item" onclick="abrirPagina('cadastrar', this)">
                Cadastrar funcionário
            </button>

            <button class="menu-item" onclick="abrirPagina('funcionarios', this)">
                Funcionários
            </button>

            <button class="menu-item" onclick="abrirPagina('planilhas', this)">
                Planilhas de funcionários
            </button>

            <button class="menu-item" onclick="exportarFuncionarios()">
                Exportar funcionários
            </button>

        </nav>

        <div class="versao">
            Prancheta RH<br>
            <span>Versão Beta</span>
        </div>

    </aside>


    <!-- ÁREA PRINCIPAL -->
    <main class="conteudo">

        <header class="cabecalho">

            <div>
                <h1 id="tituloPagina">Férias</h1>
                <p id="subtituloPagina">
                    Cálculo completo da remuneração de férias
                </p>
            </div>

        </header>


        <section id="areaConteudo"></section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
